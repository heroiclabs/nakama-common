name: protoverify
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  protoverify:
    name: Verify proto ordering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Verify proto field ordering
        run: go run github.com/heroiclabs/nakama-unreal/cmd/protoverify@sdk3 --proto api/api.proto

